[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidecar-search"
version = "0.2.1"
authors = [
	{name = "Kenny Peng", email = "knypng44@gmail.com"}
]
description = "CLI build tools for sidecar indexes to add semantic search to anything"
classifiers = [
	"Development Status :: 1 - Planning",
	"Intended Audience :: Developers",
	"Intended Audience :: Science/Research",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"torch~=2.6",
	"sentence-transformers~=3.4",
	"tqdm",
	"numpy>=1.26.4",
	"pyarrow>=19.0.0",
	# Disabled due to faiss-gpu not being available on PyPI
	# "faiss-gpu~=1.9.0",
	"datasets>=3.3.2",
]

[project.urls]
Homepage = "https://github.com/colonelwatch/sidecar-search"
Repository = "https://github.com/colonelwatch/sidecar-search.git"
Issues = "https://github.com/colonelwatch/sidecar-search/issues"

[project.scripts]
sidecar-search = "sidecar_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sidecar_search"]
exclude = ["**/tests", "**/conftest.py"]

[tool.pytest]
minversion = "9.0"  # pytest <9.0 _will not_ parse tool.pytest!
norecursedirs = [  # removes "build" from norecursedirs defaults
	"*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"
]

[tool.coverage.run]
source = ["sidecar_search"]
omit = ["*/tests/*", "*/conftest.py"]
