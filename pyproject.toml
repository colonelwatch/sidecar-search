[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidecar-search"
version = "0.3.0"
authors = [
	{name = "Kenny Peng", email = "knypng44@gmail.com"}
]
description = "CLI build tools for sidecar indexes to add semantic search to anything"
classifiers = [
	"Development Status :: 1 - Planning",
	"Intended Audience :: Developers",
	"Intended Audience :: Science/Research",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"torch>=2.4",  # Python 3.12 support
	"sentence-transformers>=3.1.1,<4",  # first numpy 2 ver; uses low-level API
	"tqdm>=4",
	"numpy>=2",
	"pyarrow>=20.0.0,<21.0.0",  # last version with stubs
	"faiss-gpu>=1.14.3",  # only these versions are official
	"datasets>=3",
	"pydantic>=2.11",  # PEP 695 support
	"pydantic-settings>=2.11",  # follows pydantic
]

[dependency-groups]
dev = [
	"pyarrow-stubs==20.0.0.20251215",  # last maintained version
	"pyrefly",
	"pytest>=9.0",  # first version with TOML support
	"pytest-benchmark>=5.2.3",  # first version with pytest 9 support
	"pytest-timeout>=2",
	"coverage[toml]>=7",
	"ruff",
	"pre-commit>=4",
]

[project.urls]
Homepage = "https://github.com/colonelwatch/sidecar-search"
Repository = "https://github.com/colonelwatch/sidecar-search.git"
Issues = "https://github.com/colonelwatch/sidecar-search/issues"

[project.scripts]
sidecar-search = "sidecar_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sidecar_search"]
exclude = ["**/tests", "**/conftest.py"]

[tool.pytest]
norecursedirs = [  # removes "build" from norecursedirs defaults
	"*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"
]
markers = ["integration"]
addopts = ["-m", "not integration", "--benchmark-disable"]
timeout = "1"

[tool.coverage.run]
source = ["sidecar_search"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.pyrefly]
project-includes = ["**/*.py*"]
infer-return-types = "never"
